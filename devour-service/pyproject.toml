# devour-service 开发工具配置（ruff / pytest）
# 依赖管理请参见 environment.yml

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008：FastAPI 依赖注入惯用 Depends()/Query() 作为默认值，属误报
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
