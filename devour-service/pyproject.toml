[project]
name = "devour-service"
version = "0.1.0"
description = "Devour 投资智能体平台 · 后端服务（FastAPI + LangChain/LangGraph）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx[socks]>=0.27",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pandas>=2.2",
    "numpy>=2.0",
    "cachetools>=5.5",
    "apscheduler>=3.10,<4",
    "tushare>=1.4.29",
]

[project.optional-dependencies]
datasources = ["tushare>=1.4.29"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devour_service"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008：FastAPI 依赖注入惯用 Depends()/Query() 作为默认值，属误报
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
